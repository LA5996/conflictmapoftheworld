name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check data files are valid JSON
        run: for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON in $f"; exit 1; }; done

      - name: Add self-hosted map outlines (so visitors never load them from a third party)
        run: |
          [ -f assets/countries-110m.json ] || curl -fsSL -o assets/countries-110m.json https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json
          [ -f assets/topojson-client.min.js ] || curl -fsSL -o assets/topojson-client.min.js https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
